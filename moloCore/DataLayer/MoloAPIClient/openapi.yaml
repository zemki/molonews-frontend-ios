openapi: 3.0.1
info:
  title: Molonews API
  description: Molonews API
  version: v4
servers:
- url: https://redaktion.molo.news/api/v4
security:
- Basic: []
paths:
  /AI/generate-article-tags/:
    post:
      tags:
      - AI
      description: This class returns the tags for a posted article using Ollama with
        Gemma 3
      operationId: AI_generate-article-tags_create
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: The title of the article
                abstract:
                  type: string
                  description: The abstract of the article
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: The title of the article
                abstract:
                  type: string
                  description: The abstract of the article
        required: true
      responses:
        "200":
          description: List of Tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagSerializerId'
        "204":
          description: No Content
          content: {}
        "400":
          description: Bad Request
          content: {}
  /AI/generate-event-tags/:
    post:
      tags:
      - AI
      description: This class returns the tags for a posted event using Ollama with
        Gemma 3
      operationId: AI_generate-event-tags_create
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: The title of the event
                abstract:
                  type: string
                  description: The description of the event
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: The title of the event
                abstract:
                  type: string
                  description: The description of the event
        required: true
      responses:
        "200":
          description: List of Event Tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagSerializerId'
        "204":
          description: No Content
          content: {}
        "400":
          description: Bad Request
          content: {}
  /admin/test-push/:
    post:
      tags:
      - admin
      description: POST /api/v4/admin/test-push/
      operationId: admin_test-push_create
      requestBody:
        content:
          application/json:
            schema:
              required:
              - code
              type: object
              properties:
                code:
                  type: string
                  description: Zugangscode (erforderlich)
                device_id:
                  type: string
                  description: Device ID des Users
                firebase_token:
                  type: string
                  description: Firebase Token direkt (alternativ
                title:
                  type: string
                  description: Push-Titel (Custom-Modus)
                  default: Test Nachricht
                message:
                  type: string
                  description: Push-Nachricht (Custom-Modus)
                  default: Dies ist eine Test-Nachricht
                article_id:
                  type: integer
                  description: Artikel-ID (Artikel-Modus)
                event_id:
                  type: integer
                  description: Event-ID (Event-Modus)
                data:
                  type: object
                  properties: {}
                  description: Zusätzliche Daten als JSON (Custom-Modus)
        required: true
      responses:
        "200":
          description: Push erfolgreich gesendet
          content: {}
        "400":
          description: Fehlerhafte Anfrage
          content: {}
        "401":
          description: Ungültiger Zugangscode
          content: {}
        "404":
          description: Ressource nicht gefunden
          content: {}
      x-codegen-request-body-name: data
  /ai-area/articles/get-unassigned-batch/:
    get:
      tags:
      - ai-area
      description: "Holt mehrere Artikel ohne Gebietszuweisung auf einmal (nur letzte\
        \ 30 Tage, nur von Quellen mit auto_detect_area_from_content=True). Query\
        \ Parameter: limit - Anzahl der Artikel (default: 10, max: 100)"
      operationId: ai-area_articles_get-unassigned-batch_read
      parameters:
      - name: Authorization
        in: header
        description: "API Key im Format: ApiKey <your_api_key>"
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: "Anzahl der Artikel (default: 10, max: 100)"
        schema:
          type: integer
      responses:
        "200":
          description: Artikel ohne Gebietszuweisung gefunden
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  articles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        abstract:
                          type: string
        "401":
          description: Unauthorized - Invalid authorization format
          content: {}
        "403":
          description: Forbidden - Invalid API key
          content: {}
  /ai-area/articles/get-unassigned/:
    get:
      tags:
      - ai-area
      description: "Holt einen Artikel ohne Gebietszuweisung (nur letzte 30 Tage,\
        \ nur published, nur von Quellen mit auto_detect_area_from_content=True)."
      operationId: ai-area_articles_get_unassigned
      parameters:
      - name: Authorization
        in: header
        description: "API Key im Format: ApiKey <your_api_key>"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Artikel ohne Gebietszuweisung gefunden
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  abstract:
                    type: string
                  current_areas:
                    type: array
                    items:
                      type: integer
        "401":
          description: Unauthorized - Invalid authorization format
          content: {}
        "403":
          description: Forbidden - Invalid API key
          content: {}
        "404":
          description: Not Found - No articles without area assignment found
          content: {}
  /ai-area/articles/submit-areas-batch/:
    post:
      tags:
      - ai-area
      description: Weist mehreren Artikeln Gebiete zu
      operationId: ai-area_articles_submit_areas_batch
      parameters:
      - name: Authorization
        in: header
        description: "API Key im Format: ApiKey <your_api_key>"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - articles
              type: object
              properties:
                articles:
                  type: array
                  description: Liste von Artikeln mit ihren Gebieten
                  items:
                    required:
                    - article_id
                    type: object
                    properties:
                      article_id:
                        type: integer
                        description: ID des Artikels
                      area_names:
                        type: array
                        description: Liste der Stadt-Namen (werden automatisch erstellt
                          wenn nicht vorhanden)
                        items:
                          type: string
                      area_ids:
                        type: array
                        description: "Liste der Gebiets-IDs (optional, alternativ\
                          \ zu area_names)"
                        items:
                          type: integer
        required: true
      responses:
        "200":
          description: Batch-Gebietszuweisung abgeschlossen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        article_id:
                          type: integer
                        success:
                          type: boolean
                        error:
                          type: string
                        areas_applied:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              created:
                                type: boolean
                                description: War die Area neu erstellt?
        "400":
          description: Bad Request - Invalid request format
          content: {}
        "401":
          description: Unauthorized - Invalid authorization format
          content: {}
        "403":
          description: Forbidden - Invalid API key
          content: {}
      x-codegen-request-body-name: data
  /ai-area/articles/submit-areas/:
    post:
      tags:
      - ai-area
      description: Weist einem Artikel Gebiete zu
      operationId: ai-area_articles_submit_areas
      parameters:
      - name: Authorization
        in: header
        description: "API Key im Format: ApiKey <your_api_key>"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - article_id
              type: object
              properties:
                article_id:
                  type: integer
                  description: ID des Artikels
                area_names:
                  type: array
                  description: "Liste der Stadt-Namen (werden automatisch erstellt\
                    \ wenn nicht vorhanden). Leere Liste [] erlaubt - markiert Artikel\
                    \ als verarbeitet ohne Areas zuzuweisen."
                  items:
                    type: string
                area_ids:
                  type: array
                  description: "Liste der Gebiets-IDs (optional, alternativ zu area_names).\
                    \ Leere Liste [] erlaubt - markiert Artikel als verarbeitet ohne\
                    \ Areas zuzuweisen."
                  items:
                    type: integer
        required: true
      responses:
        "200":
          description: Gebiete erfolgreich zugewiesen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  article_id:
                    type: integer
                  areas_applied:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
        "400":
          description: Bad Request - article_id missing or invalid area IDs
          content: {}
        "401":
          description: Unauthorized - Invalid authorization format
          content: {}
        "403":
          description: Forbidden - Invalid API key
          content: {}
        "404":
          description: Not Found - Article not found
          content: {}
      x-codegen-request-body-name: data
  /ai-tagging/articles/get-untagged-batch/:
    get:
      tags:
      - ai-tagging
      description: "Holt mehrere ungetaggte Artikel auf einmal (nur letzte 30 Tage).\
        \ Query Parameter: limit - Anzahl der Artikel (default: 10, max: 100)"
      operationId: ai-tagging_articles_get-untagged-batch_read
      parameters:
      - name: Authorization
        in: header
        description: "API Key im Format: ApiKey <your_api_key>"
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: "Anzahl der Artikel (default: 10, max: 100)"
        schema:
          type: integer
      responses:
        "200":
          description: Ungetaggte Artikel gefunden
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  articles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        abstract:
                          type: string
        "401":
          description: Unauthorized - Invalid authorization format
          content: {}
        "403":
          description: Forbidden - Invalid API key
          content: {}
  /ai-tagging/articles/get-untagged/:
    get:
      tags:
      - ai-tagging
      description: "Holt einen ungetaggten Artikel zum Tagging (nur letzte 30 Tage).\
        \ Hinweis: Das 'content' Feld wird nicht zurückgegeben, da bei 99,998% aller\
        \ Artikel dieses Feld leer ist. Der eigentliche Artikeltext steht im 'abstract'\
        \ Feld."
      operationId: ai-tagging_articles_get_untagged
      parameters:
      - name: Authorization
        in: header
        description: "API Key im Format: ApiKey <your_api_key>"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ungetaggter Artikel gefunden
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  abstract:
                    type: string
                  current_tags:
                    type: array
                    items:
                      type: integer
        "401":
          description: Unauthorized - Invalid authorization format
          content: {}
        "403":
          description: Forbidden - Invalid API key
          content: {}
        "404":
          description: Not Found - No untagged articles found
          content: {}
  /ai-tagging/articles/submit-tags-batch/:
    post:
      tags:
      - ai-tagging
      description: Speichert die KI-generierten Tags für mehrere Artikel auf einmal
      operationId: ai-tagging_articles_submit_tags_batch
      parameters:
      - name: Authorization
        in: header
        description: "API Key im Format: ApiKey <your_api_key>"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - articles
              type: object
              properties:
                articles:
                  type: array
                  description: Liste von Artikeln mit ihren Tags
                  items:
                    required:
                    - article_id
                    - tag_ids
                    type: object
                    properties:
                      article_id:
                        type: integer
                        description: ID des zu taggenden Artikels
                      tag_ids:
                        type: array
                        description: Liste der Tag-IDs
                        items:
                          type: integer
        required: true
      responses:
        "200":
          description: Batch-Tagging abgeschlossen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  total:
                    type: integer
                  successful:
                    type: integer
                  failed:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        article_id:
                          type: integer
                        success:
                          type: boolean
                        tags_applied:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                        error:
                          type: string
        "400":
          description: Bad Request - Invalid request format
          content: {}
        "401":
          description: Unauthorized - Invalid authorization format
          content: {}
        "403":
          description: Forbidden - Invalid API key
          content: {}
      x-codegen-request-body-name: data
  /ai-tagging/articles/submit-tags/:
    post:
      tags:
      - ai-tagging
      description: Speichert die KI-generierten Tags für einen Artikel
      operationId: ai-tagging_articles_submit_tags
      parameters:
      - name: Authorization
        in: header
        description: "API Key im Format: ApiKey <your_api_key>"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - article_id
              - tag_ids
              type: object
              properties:
                article_id:
                  type: integer
                  description: ID des zu taggenden Artikels
                tag_ids:
                  type: array
                  description: Liste der Tag-IDs
                  items:
                    type: integer
        required: true
      responses:
        "200":
          description: Tags erfolgreich gespeichert
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  article_id:
                    type: integer
                  tags_applied:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
        "400":
          description: Bad Request - article_id missing or invalid tag IDs
          content: {}
        "401":
          description: Unauthorized - Invalid authorization format
          content: {}
        "403":
          description: Forbidden - Invalid API key
          content: {}
        "404":
          description: Not Found - Article not found
          content: {}
      x-codegen-request-body-name: data
  /ai-tagging/events/get-untagged-batch/:
    get:
      tags:
      - ai-tagging
      description: "Holt mehrere ungetaggte Events auf einmal. Query Parameter: limit\
        \ - Anzahl der Events (default: 10, max: 100). Events von Sources mit type='local'\
        \ werden ausgeschlossen."
      operationId: ai-tagging_events_get-untagged-batch_read
      parameters:
      - name: Authorization
        in: header
        description: "API Key im Format: ApiKey <your_api_key>"
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: "Anzahl der Events (default: 10, max: 100)"
        schema:
          type: integer
      responses:
        "200":
          description: Ungetaggte Events gefunden
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        content:
                          type: string
                        start_date:
                          type: string
                          format: date-time
                        event_location:
                          type: string
        "401":
          description: Unauthorized - Invalid authorization format
          content: {}
        "403":
          description: Forbidden - Invalid API key
          content: {}
  /ai-tagging/events/get-untagged/:
    get:
      tags:
      - ai-tagging
      description: Holt ein ungetaggtes Event zum Tagging. Events von Sources mit
        type='local' werden ausgeschlossen.
      operationId: ai-tagging_events_get_untagged
      parameters:
      - name: Authorization
        in: header
        description: "API Key im Format: ApiKey <your_api_key>"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ungetaggtes Event gefunden
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  content:
                    type: string
                  start_date:
                    type: string
                    format: date-time
                  event_location:
                    type: string
                  current_tags:
                    type: array
                    items:
                      type: integer
        "401":
          description: Unauthorized - Invalid authorization format
          content: {}
        "403":
          description: Forbidden - Invalid API key
          content: {}
        "404":
          description: Not Found - No untagged events found
          content: {}
  /ai-tagging/events/submit-tags-batch/:
    post:
      tags:
      - ai-tagging
      description: Speichert die KI-generierten Tags für mehrere Events auf einmal
      operationId: ai-tagging_events_submit_tags_batch
