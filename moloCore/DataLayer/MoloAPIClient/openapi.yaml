components:
  schemas:
    TagSerializerId:
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
    Area:
      required:
      - name
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        name:
          title: Name
          maxLength: 100
          minLength: 1
          type: string
        longitude:
          title: Longitude
          type: string
          format: decimal
          nullable: true
        latitude:
          title: Latitude
          type: string
          format: decimal
          nullable: true
    ListArea:
      required:
      - count
      - results
      type: object
      properties:
        count:
          title: Count
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Area'
    ArticleTagsSerializerV4:
      required:
      - name
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        name:
          title: Name
          maxLength: 30
          minLength: 1
          type: string
        color:
          title: Color
          maxLength: 10
          type: string
        selected:
          title: Selected
          type: boolean
          readOnly: true
    ArticleList:
      required:
      - area
      - title
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        title:
          title: Titel
          maxLength: 350
          minLength: 1
          type: string
        abstract:
          title: Abstrakt
          type: string
          nullable: true
        date:
          title: Date
          type: string
          description: |2

            This method returns the date of the article in ISO format.
            It removes the microseconds from the date before converting it to ISO format.
          format: date-time
          readOnly: true
        image_url:
          title: Image url
          type: string
          readOnly: true
        area:
          uniqueItems: true
          type: array
          items:
            title: Gebiet
            type: integer
        address:
          title: Adresse
          maxLength: 300
          type: string
        link:
          title: Link
          type: string
          readOnly: true
        is_hot:
          title: Ist aktuell
          type: boolean
        tags:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/ArticleTagsSerializerV4'
        organization:
          title: Organization
          type: integer
          description: |2

            This method returns the ID of the organization that the article's source belongs to.
          readOnly: true
        organization_type:
          title: Organization type
          type: string
          readOnly: true
        organization_name:
          title: Organization name
          type: string
          readOnly: true
        organization_image:
          title: Organization image
          type: string
          readOnly: true
        image_source:
          title: Bildquelle
          maxLength: 600
          type: string
          nullable: true
        request_count:
