        description: "API Key im Format: ApiKey <your_api_key>"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - events
              type: object
              properties:
                events:
                  type: array
                  description: Liste von Events mit ihren Tags
                  items:
                    required:
                    - event_id
                    - tag_ids
                    type: object
                    properties:
                      event_id:
                        type: integer
                        description: ID des zu taggenden Events
                      tag_ids:
                        type: array
                        description: Liste der Tag-IDs
                        items:
                          type: integer
        required: true
      responses:
        "200":
          description: Batch-Tagging abgeschlossen
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  total:
                    type: integer
                  successful:
                    type: integer
                  failed:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        event_id:
                          type: integer
                        success:
                          type: boolean
                        tags_applied:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                        error:
                          type: string
        "400":
          description: Bad Request - Invalid request format
          content: {}
        "401":
          description: Unauthorized - Invalid authorization format
          content: {}
        "403":
          description: Forbidden - Invalid API key
          content: {}
      x-codegen-request-body-name: data
  /ai-tagging/events/submit-tags/:
    post:
      tags:
      - ai-tagging
      description: Speichert die KI-generierten Tags für ein Event
      operationId: ai-tagging_events_submit_tags
      parameters:
      - name: Authorization
        in: header
        description: "API Key im Format: ApiKey <your_api_key>"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - event_id
              - tag_ids
              type: object
              properties:
                event_id:
                  type: integer
                  description: ID des zu taggenden Events
                tag_ids:
                  type: array
                  description: Liste der Tag-IDs
                  items:
                    type: integer
        required: true
      responses:
        "200":
          description: Tags erfolgreich gespeichert
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  event_id:
                    type: integer
                  tags_applied:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
        "400":
