  /area/:
    get:
      tags:
      - area
      description: Get locations where molo.news is available
      operationId: area_list
      parameters:
      - name: area
        in: query
        description: area
        schema:
          type: string
      - name: longitude
        in: query
        description: longitude
        schema:
          type: string
      - name: latitude
        in: query
        description: latitude
        schema:
          type: string
      - name: X-Device-ID
        in: header
        description: Device ID
        schema:
          type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListArea'
        "400":
          description: Device ID does not exist
          content: {}
    post:
      tags:
      - area
      description: Create a new location where molo.news is available
      operationId: area_create
      requestBody:
        content:
          application/json:
            schema:
              required:
              - area
              - latitude
              - longitude
              - zip_code
              type: object
              properties:
                area:
                  type: string
                  description: Name of the area
                longitude:
                  type: number
                  description: Longitude of the area
                latitude:
                  type: number
                  description: Latitude of the area
                zip_code:
                  type: string
                  description: Zip code of the area
        required: true
      responses:
        "201":
          description: Created
          content: {}
        "400":
          description: Bad Request
          content: {}
        "401":
          description: Unauthorized
          content: {}
        "409":
          description: Conflict - Area already exists
          content: {}
      x-codegen-request-body-name: data
  /area/by_distance/:
    get:
      tags:
      - area
      description: Get locations within a specified distance from a given point
      operationId: area_by_distance
      parameters:
      - name: longitude
        in: query
        description: Longitude of the starting point
        schema:
          type: string
      - name: latitude
        in: query
        description: Latitude of the starting point
        schema:
          type: string
      - name: distance
        in: query
        description: Distance in kilometers
        schema:
          type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListArea'
        "400":
          description: Bad Request
          content: {}
  /area/closest/:
    get:
      tags:
      - area
      description: Get the closest location where molo.news is available
      operationId: area_closest
      parameters:
      - name: longitude
        in: query
        description: longitude
        schema:
          type: string
      - name: latitude
        in: query
        description: latitude
        schema:
          type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        "400":
          description: Bad Request
          content: {}
  /area/{id}/:
    delete:
      tags:
      - area
      description: Delete a location where molo.news is available
      operationId: area_delete
      parameters:
      - name: id
        in: path
        description: A unique integer value identifying this Gebiet.
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Deleted
          content: {}
        "400":
          description: Bad Request
          content: {}
  /articles/:
    get:
